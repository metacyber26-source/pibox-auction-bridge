<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Legal Proof - NFT Global Market</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-lg bg-gray-950 border border-yellow-500/40 rounded-2xl shadow-2xl p-6 space-y-6">
    
    <!-- Header -->
    <div class="text-center border-b border-gray-800 pb-4">
      <h1 class="text-base font-bold text-yellow-400 tracking-wider">NFT GLOBAL MARKET & AUCTION ENGINE</h1>
      <p class="text-xs text-gray-400 mt-1">Official Legal Proof of Asset Release & Transaction Certificate</p>
    </div>

    <!-- Detail Content -->
    <div id="legalProofDetails" class="space-y-4 text-xs">
      <div class="text-center text-gray-400 animate-pulse py-8">Loading Real-time Legal Proof Data...</div>
    </div>

    <!-- Actions -->
    <div id="actionContainer" class="flex flex-col gap-2 pt-2 hidden">
      <button id="downloadPdfBtn" onclick="downloadPDF()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold py-3 rounded-xl transition shadow cursor-pointer text-xs flex items-center justify-center gap-2">
        📥 Download Official Legal Proof (PDF)
      </button>
      <a href="index.html" class="w-full bg-gray-900 hover:bg-gray-800 text-gray-300 font-semibold py-2.5 rounded-xl text-center transition text-xs">
        ← Back to Auction Gallery
      </a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://lgxvdqveblueuadocimv.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_TBKKXJkwiqMmAYJKqAdwgw__nqQA8xJ";
    let supabaseClient = null;
    let currentAuctionData = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {}

    async function loadAuctionLegalData() {
      const urlParams = new URLSearchParams(window.location.search);
      const auctionId = urlParams.get('id');
      const detailsContainer = document.getElementById('legalProofDetails');
      const actionContainer = document.getElementById('actionContainer');

      if (!auctionId || !supabaseClient) {
        detailsContainer.innerHTML = `<div class="text-center text-red-400 py-6">Asset ID not found or database connection failed.</div>`;
        return;
      }

      try {
        // Real-time fetch from Supabase
        const { data, error } = await supabaseClient
          .from('auctions')
          .select('*')
          .eq('id', auctionId)
          .single();

        if (error || !data) throw new Error("Auction asset data not found in database.");

        currentAuctionData = data;

        const rawBuyer = data.highest_bidder || 'No Bidder Yet';
        const maskedBuyer = rawBuyer !== 'No Bidder Yet' ? '@' + rawBuyer : 'None';
        const sellerName = '@' + (data.seller || 'Unknown');
        const piboxWallet = '@' + (data.pibox_wallet || data.seller || 'Unknown');

        detailsContainer.innerHTML = `
          <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800 space-y-2">
            <p class="text-yellow-400 font-bold text-sm mb-2">📦 Asset Specifications:</p>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">Asset Title:</span> <span class="text-white font-semibold">${data.title || '-'}</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">Category:</span> <span class="text-white font-mono">${data.category || '-'}</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">Unique Ref Hash:</span> <span class="text-yellow-400 font-mono text-[11px]">${data.hash || '-'}</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">Reserve Price:</span> <span class="text-emerald-400 font-bold">${data.reserve_price || 0} Pi</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">Final / Highest Bid:</span> <span class="text-emerald-400 font-bold">${data.highest_bid || data.reserve_price || 0} Pi</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Auction Status:</span> <span class="uppercase text-amber-400 font-bold">${data.status || 'active'}</span></div>
          </div>

          <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-800 space-y-2">
            <p class="text-yellow-400 font-bold text-sm mb-2">👤 Parties Involved:</p>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">Seller Username:</span> <span class="text-white font-mono">${sellerName}</span></div>
            <div class="flex justify-between border-b border-gray-800 pb-1.5"><span class="text-gray-400">PiBox Wallet:</span> <span class="text-white font-mono">${piboxWallet}</span></div>
            <div class="flex justify-between"><span class="text-gray-400">Winning Bidder:</span> <span class="text-emerald-400 font-mono font-bold">${maskedBuyer}</span></div>
          </div>

          <div class="bg-red-950/30 border border-red-500/40 p-3.5 rounded-xl text-[10px] text-gray-300 space-y-1.5">
            <p class="font-bold text-red-400">⚖️ LEGAL DISCLAIMER & INTERMEDIARY NOTICE:</p>
            <p class="leading-relaxed">
              This platform acts solely as a technological intermediary facilitator for multi-asset auction listings. All legal liabilities, civil or criminal claims regarding asset authenticity, intellectual property rights, ownership validity, originality, or potential counterfeit goods rest entirely upon the private seller and buyer. The platform is fully released from any legal disputes.
            </p>
          </div>
        `;

        actionContainer.classList.remove('hidden');
      } catch (err) {
        detailsContainer.innerHTML = `<div class="text-center text-red-400 py-6">${err.message}</div>`;
      }
    }

    function downloadPDF() {
      if (!currentAuctionData) return;
      const auction = currentAuctionData;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFillColor(11, 15, 23);
      doc.rect(0, 0, 210, 297, "F");

      doc.setTextColor(255, 215, 0);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text("NFT GLOBAL MARKET & AUCTION ENGINE", 20, 20);

      doc.setTextColor(200, 200, 200);
      doc.setFontSize(10);
      doc.text("Official Legal Proof of Asset Release & Transaction Certificate", 20, 28);

      doc.setDrawColor(255, 215, 0);
      doc.line(20, 35, 190, 35);

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(12);
      doc.text("ASSET SPECIFICATIONS:", 20, 48);

      doc.setFontSize(10);
      doc.setTextColor(220, 220, 220);
      doc.text(`- Asset Title / Name : ${auction.title || '-'}`, 25, 58);
      doc.text(`- Category                : ${auction.category || '-'}`, 25, 66);
      doc.text(`- Unique Ref Hash   : ${auction.hash || '-'}`, 25, 74);
      doc.text(`- Reserve Price        : ${auction.reserve_price || 0} Pi`, 25, 82);
      doc.text(`- Final / Highest Bid : ${auction.highest_bid || auction.reserve_price || 0} Pi`, 25, 90);
      doc.text(`- Status                    : ${(auction.status || 'active').toUpperCase()}`, 25, 98);

      doc.setFontSize(12);
      doc.setTextColor(255, 215, 0);
      doc.text("PARTIES INVOLVED:", 20, 112);

      doc.setFontSize(10);
      doc.setTextColor(220, 220, 220);
      doc.text(`- Seller Username    : @${auction.seller || '-'}`, 25, 122);
      doc.text(`- PiBox Wallet         : @${auction.pibox_wallet || auction.seller || '-'}`, 25, 130);
      doc.text(`- Winning Bidder     : @${auction.highest_bidder || 'None'}`, 25, 138);

      doc.setFontSize(11);
      doc.setTextColor(255, 90, 90);
      doc.text("LEGAL DISCLAIMER & INTERMEDIARY NOTICE:", 20, 156);

      doc.setFontSize(8.5);
      doc.setTextColor(180, 180, 180);
      const disclaimerText = 
        "This platform acts solely as a technological intermediary facilitator for multi-asset auction listings. " +
        "All legal liabilities, civil or criminal claims regarding asset authenticity, intellectual property rights, ownership validity, " +
        "originality, or potential counterfeit goods rest entirely upon the private seller and buyer. The platform is fully released from any legal disputes.";
      
      const splitDisclaimer = doc.splitTextToSize(disclaimerText, 170);
      doc.text(splitDisclaimer, 20, 164);

      doc.setDrawColor(100, 100, 100);
      doc.line(20, 220, 100, 220);
      doc.setFontSize(9);
      doc.setTextColor(150, 150, 150);
      doc.text("Authorized Platform Mediator", 20, 226);
      doc.text(`Generated Date: ${new Date().toUTCString()}`, 20, 234);

      doc.save(`Legal-Proof-${auction.id}.pdf`);
    }

    window.onload = loadAuctionLegalData;
  </script>
</body>
</html>
