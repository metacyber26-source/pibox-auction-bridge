<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pibox Metaverse Marketplace 3D</title>
  
  <!-- A-Frame CDN untuk Web 3D / Metaverse Ringan -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- Tailwind CSS untuk Desain UI Modal Transaksi -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body class="bg-black text-white font-sans overflow-hidden">

  <!-- Navigasi Atas / Kembali ke Mode Web -->
  <div class="absolute top-4 left-4 z-50 flex gap-2">
    <a href="marketplace.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition">⬅️ Kembali ke Web Standar</a>
  </div>

  <!-- Indikator Petunjuk Interaksi -->
  <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-50 bg-gray-900/80 border border-gray-800 px-4 py-2 rounded-2xl text-[11px] text-yellow-400 backdrop-blur-md shadow-xl pointer-events-none">
    🎮 Gunakan W, A, S, D / Geser Layar untuk Bergerak • Klik Produk untuk Membeli
  </div>

  <!-- SCENE DUNIA 3D METAVERSE -->
  <a-scene embedded style="width: 100vw; height: 100vh;">
    <a-sky color="#0b0f17"></a-sky>
    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" position="2 4 2" intensity="0.6"></a-light>

    <!-- Kamera & Kursor untuk Klik Objek 3D -->
    <a-entity position="0 1.6 4">
      <a-camera look-controls wasd-controls>
        <a-cursor raycaster="objects: .clickable" fuse="false" material="color: #f3f4f6; shader: flat" position="0 0 -1" scale="0.5 0.5 0.5"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Etalase Ruang Showroom Virtual 3D -->
    <a-entity id="virtualShowroom" position="0 0 -2"></a-entity>
  </a-scene>

  <!-- MODAL TRANSAKSI / DETAIL PRODUK DI METAVERSE -->
  <div id="metaverseModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-950 border border-gray-800 rounded-2xl p-4 w-full max-w-sm space-y-3 shadow-2xl text-xs text-white">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h2 id="modalProdTitle" class="font-bold text-yellow-400 uppercase text-sm">Detail Produk</h2>
        <button onclick="closeMetaverseModal()" class="text-gray-400 hover:text-white font-bold text-lg">&times;</button>
      </div>

      <div class="space-y-2">
        <div class="w-full h-32 bg-gray-900 rounded-xl overflow-hidden border border-gray-800 flex items-center justify-center">
          <img id="modalProdImg" src="" class="w-full h-full object-cover">
        </div>
        <p id="modalProdDesc" class="text-[10px] text-gray-300 bg-gray-900 p-2 rounded-lg max-h-20 overflow-y-auto"></p>
        
        <div class="bg-gray-900 p-2.5 rounded-xl border border-gray-800 space-y-1 text-[10px]">
          <div class="flex justify-between"><span class="text-gray-400">Penjual:</span><span id="modalProdSeller" class="text-yellow-400 font-mono"></span></div>
          <div class="flex justify-between"><span class="text-gray-400">Pengiriman:</span><span id="modalProdShipping" class="text-gray-200"></span></div>
          <div class="flex justify-between"><span class="text-gray-400">Harga Bersih:</span><span id="modalProdPrice" class="text-emerald-400 font-bold"></span></div>
          <div class="flex justify-between"><span class="text-gray-400">Biaya Layanan:</span><span class="text-yellow-400 font-bold">0.20 Pi</span></div>
        </div>

        <!-- Tombol Transaksi Langsung SDK Pi -->
        <button onclick="executeMetaverseCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs shadow cursor-pointer transition">
          🤝 Beli via SDK Pi (<span id="modalGrandTotal">0.00</span> Pi)
        </button>
      </div>
      <button onclick="closeMetaverseModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-gray-300 py-2 rounded-xl transition">Tutup</button>
    </div>
  </div>

  <!-- SKRIP LOGIKA SUPABASE & INTERAKSI 3D -->
  <script>
    const SUPABASE_URL = "https://lgxvdqveblueuadocimv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_TBKKXJkwiqMmAYJKqAdwgw__nqQA8xJ";
    const DEV_WALLET_ADDRESS = "GD52XTI2BXBRUQR227L4LQNO55NKTB5QO2PQMHNKVBSVGST2U5C2S4LD";
    
    let supabaseClient = null;
    let selectedProductData = null;
    let authenticatedPiUser = { username: "Dev" };

    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {}

    document.addEventListener("DOMContentLoaded", async () => {
      initPiSDK();
      await loadMetaverseProducts();
    });

    function initPiSDK() {
      const piInstance = window.Pi || (typeof Pi !== 'undefined' ? Pi : null);
      if (piInstance && typeof piInstance.init === 'function') {
        try { piInstance.init({ version: "2.0", sandbox: true }); } catch(e) {}
      }
    }

    async function loadMetaverseProducts() {
      if (!supabaseClient) return;
      const { data: products } = await supabaseClient.from('marketplace_products').select('*').order('created_at', { ascending: false });
      const showroom = document.getElementById('virtualShowroom');

      if (products && products.length > 0) {
        let roomHTML = '';
        products.forEach((prod, index) => {
          // Menyusun posisi stan 3D secara melingkar atau berderet di ruang metaverse
          let xPos = (index - (products.length - 1) / 2) * 2.5;
          
          roomHTML += `
            <a-entity position="${xPos} 0 0">
              <!-- Podium / Alas Produk 3D -->
              <a-box position="0 -0.5 0" width="1.6" height="0.1" depth="1.6" color="#1e293b"></a-box>
              
              <!-- Papan Display Gambar & Informasi Produk (Bisa Diklik / Class .clickable) -->
              <a-plane class="clickable" position="0 0.8 0" width="1.4" height="1.4" src="${prod.image_url}" roughness="0.5"
                       onclick="openMetaverseModal('${prod.id}')">
              </a-plane>

              <!-- Papan Label Harga di Atas Produk -->
              <a-plane position="0 1.7 0" width="1.5" height="0.4" color="#111827" 
                       text="value: ${prod.title}\n${prod.price} Pi; color: #f3f4f6; align: center; width: 3.5;">
              </a-plane>
            </a-entity>
          `;
        });
        showroom.innerHTML = roomHTML;
      }
    }

    async function openMetaverseModal(prodId) {
      if (!supabaseClient) return;
      const { data: prod } = await supabaseClient.from('marketplace_products').select('*').eq('id', prodId).single();
      if (!prod) return;

      selectedProductData = prod;
      const serviceFee = 0.20;
      const grandTotal = parseFloat(prod.price) + serviceFee;

      document.getElementById('modalProdTitle').innerText = prod.title;
      document.getElementById('modalProdImg').src = prod.image_url;
      document.getElementById('modalProdDesc').innerText = prod.description || 'Tidak ada deskripsi.';
      document.getElementById('modalProdSeller').innerText = '@' + prod.seller;
      document.getElementById('modalProdShipping').innerText = prod.shipping || 'P2P COD';
      document.getElementById('modalProdPrice').innerText = prod.price + ' Pi';
      document.getElementById('modalGrandTotal').innerText = grandTotal.toFixed(2);

      document.getElementById('metaverseModal').classList.remove('hidden');
    }

    function closeMetaverseModal() {
      document.getElementById('metaverseModal').classList.add('hidden');
      selectedProductData = null;
    }

    function executeMetaverseCheckout() {
      if (!selectedProductData) return;

      const serverFee = 0.20;
      const totalAmount = parseFloat(selectedProductData.price) + serverFee;
      const memoText = `P2P-METAVERSE#${selectedProductData.id}#TO:${selectedProductData.seller}#FEE:${serverFee}`;

      const paymentData = {
        amount: totalAmount,
        memo: memoText,
        metadata: { type: 'metaverse_p2p', prodId: selectedProductData.id, seller: selectedProductData.seller, buyer: authenticatedPiUser.username, devWallet: DEV_WALLET_ADDRESS }
      };

      const piInstance = window.Pi || (typeof Pi !== 'undefined' ? Pi : null);
      if (piInstance && typeof piInstance.createPayment === 'function') {
        piInstance.createPayment(paymentData, {
          onReadyForServerApproval: async (pid) => { await fetch('/api/pi/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId: pid }) }).catch(()=>{}); },
          onReadyForServerCompletion: async (pid, txid) => {
            await fetch('/api/pi/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paymentId: pid, txid }) }).catch(()=>{});
            await recordMetaverseTransaction(selectedProductData, totalAmount, serverFee, txid);
          },
          onCancel: () => { alert("Pembayaran Metaverse dibatalkan."); },
          onError: () => { recordMetaverseTransaction(selectedProductData, totalAmount, serverFee, 'SIMULATED_METAVERSE_TXID'); }
        });
      } else {
        recordMetaverseTransaction(selectedProductData, totalAmount, serverFee, 'SIMULATED_BROWSER_METAVERSE_TXID');
      }
    }

    async function recordMetaverseTransaction(prod, totalAmount, serverFee, txid) {
      if (!supabaseClient) return;
      try {
        await supabaseClient.from('marketplace_transactions').insert([{
          product_id: prod.id,
          title: prod.title,
          seller: prod.seller,
          buyer: authenticatedPiUser.username,
          total_paid: totalAmount,
          dev_server_fee: serverFee,
          wallet_destination: DEV_WALLET_ADDRESS,
          txid: txid,
          shipping_status: 'Diproses Penjual',
          created_at: new Date().toISOString()
        }]);

        const currentStock = prod.stock !== undefined ? prod.stock : 1;
        const newStock = Math.max(0, currentStock - 1);

        if (newStock === 0) {
          await supabaseClient.from('marketplace_products').delete().eq('id', prod.id);
        } else {
          await supabaseClient.from('marketplace_products').update({ stock: newStock }).eq('id', prod.id);
        }

        alert(`🎉 Transaksi Ruang Metaverse Sukses!\nTotal: ${totalAmount.toFixed(2)} Pi. Barang tercatat di riwayat.`);
        closeMetaverseModal();
        loadMetaverseProducts();
      } catch (e) {
        alert("Gagal mencatat transaksi: " + e.message);
      }
    }
  </script>
</body>
</html>
