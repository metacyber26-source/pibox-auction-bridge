<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabel Daftar Pembeli & Status - PiBox Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col items-center justify-start min-h-screen p-3">

  <div class="w-full max-w-2xl bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
      <div>
        <h2 class="text-sm font-bold text-yellow-400">👥 Tabel Daftar Calon Pembeli & Status Verifikasi</h2>
        <p class="text-[10px] text-gray-400">Modul Manajemen Pembeli On-Chain Terpusat</p>
      </div>
      <a href="index.html" class="text-gray-400 hover:text-white font-bold text-xs cursor-pointer">&times; Kembali</a>
    </div>

    <!-- Konten Tabel Pembeli & Pencarian -->
    <div class="space-y-3 text-xs">
      <div class="flex justify-between items-center gap-2">
        <input type="text" id="searchBuyerInput" oninput="renderBuyersTable()" placeholder="Cari username pembeli..." class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-500">
        <div id="adminDeleteBatchContainer" class="hidden">
          <button onclick="deleteSelectedBuyers()" class="bg-red-600 hover:bg-red-500 text-white font-bold text-[10px] px-3 py-2 rounded-xl transition shadow cursor-pointer">🗑 Hapus Terpilih</button>
        </div>
      </div>

      <div class="border border-gray-800 rounded-xl overflow-hidden max-h-[60vh] flex flex-col">
        <div class="overflow-x-auto custom-scrollbar flex-1">
          <table class="w-full text-left text-[11px] text-gray-300 min-w-[550px] border-collapse">
            <thead class="bg-gray-950 text-gray-400 uppercase text-[9px] border-b border-gray-800 sticky top-0 z-30 shadow-md">
              <tr>
                <th class="p-2.5 text-center w-8 bg-gray-950 sticky left-0 z-40 border-r border-gray-800"><input type="checkbox" id="selectAllBuyers" onclick="toggleSelectAllBuyers(this)"></th>
                <th class="p-2.5 bg-gray-950 sticky left-8 z-40 border-r border-gray-800 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">Username</th>
                <th class="p-2.5 text-center bg-gray-950">Saldo Jaminan</th>
                <th class="p-2.5 bg-gray-950">Status Verifikasi</th>
                <th class="p-2.5 text-right bg-gray-950">Aksi Admin</th>
                <th class="p-2.5 text-center bg-gray-950">Pengembalian Jaminan</th>
              </tr>
            </thead>
            <tbody id="buyersTableBody" class="overflow-y-auto max-h-[50vh]">
              <tr><td colspan="6" class="text-center py-10 text-gray-500 animate-pulse">Memuat data pembeli...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>

</body>
</html>
