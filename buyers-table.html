<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

<body class="bg-gray-950 text-gray-100 flex flex-col items-center justify-start min-h-screen p-3">

  <div class="w-full max-w-3xl bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-4 shadow-2xl">
    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
      <div>
        <h2 class="text-sm font-bold text-yellow-400">👥 Tabel Daftar Calon Pembeli & Status Verifikasi</h2>
        <p class="text-[10px] text-gray-400">Modul Manajemen Pembeli On-Chain Terpusat</p>
      </div>
      <a href="index.html" class="text-gray-400 hover:text-white font-bold text-xs cursor-pointer">&times; Kembali</a>
    </div>

    <div class="space-y-3 text-xs">
      <div class="flex justify-between items-center gap-2">
        <input type="text" id="searchBuyerInput" oninput="renderBuyersTable()" placeholder="Cari username pembeli..." class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-500">
        <div id="adminDeleteBatchContainer" class="hidden">
          <button type="button" onclick="deleteSelectedBuyers()" class="bg-red-600 hover:bg-red-500 text-white font-bold text-[10px] px-3 py-2 rounded-xl transition shadow cursor-pointer">🗑 Hapus Terpilih</button>
        </div>
      </div>

      <div class="border border-gray-800 rounded-xl overflow-hidden max-h-[60vh] flex flex-col">
        <div class="overflow-x-auto custom-scrollbar flex-1">
          <table class="w-full text-left text-[11px] text-gray-300 min-w-[780px] border-collapse">
            <thead class="bg-gray-950 text-gray-400 uppercase text-[9px] border-b border-gray-800 sticky top-0 z-30 shadow-md">
              <tr>
                <th class="p-2.5 text-center w-8 bg-gray-950 sticky left-0 z-40 border-r border-gray-800"><input type="checkbox" id="selectAllBuyers" onclick="toggleSelectAllBuyers(this)"></th>
                <th class="p-2.5 bg-gray-950 sticky left-8 z-40 border-r border-gray-800 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">Username</th>
                <th class="p-2.5 text-center bg-gray-950">Seller Collateral</th>
                <th class="p-2.5 text-center bg-gray-950">Buyer Collateral</th>
                <th class="p-2.5 text-center bg-gray-950">Keterangan</th>
                <th class="p-2.5 bg-gray-950">Status Verifikasi</th>
                <th class="p-2.5 text-right bg-gray-950">Aksi Admin</th>
                <th class="p-2.5 text-center bg-gray-950">Pengembalian Jaminan</th>
                <th class="p-2.5 text-left bg-gray-950">Wallet Pengguna</th>
              </tr>
            </thead>
            <tbody id="buyersTableBody" class="overflow-y-auto max-h-[50vh]">
              <tr><td colspan="9" class="text-center py-10 text-gray-500 animate-pulse">Memuat data pembeli...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lgxvdqveblueuadocimv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_TBKKXJkwiqMmAYJKqAdwgw__nqQA8xJ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_USERNAMES = ["Ful21", "s9t9munah"];
    let buyersList = [];
    let authenticatedPiUser = null;
    let fetchSequenceId = 0;
    let syncDebounceTimer = null;

    const _BuyersAccessGuardian = {
      version: "4.4.0-secure-buyers",
      verifyAdminAction: function(username) {
        if (!username) return false;
        return ADMIN_USERNAMES.includes(username.trim());
      },
      enforceAccess: function(username) {
        if (!this.verifyAdminAction(username)) {
          throw new Error("⛔ AKSES DITOLAK: Hanya Admin yang dapat memodifikasi status pembeli.");
        }
        return true;
      }
    };

    document.addEventListener("DOMContentLoaded", async () => {
      const savedAccounts = JSON.parse(localStorage.getItem('pibox_saved_verified_accounts') || '[]');
      if (savedAccounts.length > 0 && savedAccounts[0].username) {
        authenticatedPiUser = { username: savedAccounts[0].username };
      } else {
        authenticatedPiUser = { username: "Ful21" };
      }

      await fetchBuyersList();
    });

    const _BuyersTableSyncGuardian = {
      channel: null,
      ledgerKey: 'pibox_collateral_ledger_v2',
      legacyLedgerKey: 'pibox_agi_collateral_ledger_v2',
      fallbackKey: 'pibox_collateral_ledger_v1',

      toExact: function(v) {
        const n = Number(v);
        return Number.isFinite(n) ? Math.round((n + Number.EPSILON) * 1e6) / 1e6 : 0;
      },

      addExact: function(a, b) {
        return (Math.round((this.toExact(a) + Number.EPSILON) * 1e6) + Math.round((this.toExact(b) + Number.EPSILON) * 1e6)) / 1e6;
      },

      parseTimestampMs: function(val) {
        if (!val) return 0;
        if (typeof val === 'number' && Number.isFinite(val)) return val;
        const parsed = Date.parse(String(val));
        return Number.isFinite(parsed) ? parsed : 0;
      },

      readLocalMap: function(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : {};
        } catch (_) {
          return {};
        }
      },

      writeLocalRecord: function(usernameKey, record) {
        const keys = [this.ledgerKey, this.legacyLedgerKey, this.fallbackKey];
        keys.forEach((storageKey) => {
          try {
            const currentMap = this.readLocalMap(storageKey);
            currentMap[usernameKey] = record;
            localStorage.setItem(storageKey, JSON.stringify(currentMap));
          } catch (_) {}
        });
      },

      mergeWithLocalLedger: function(dbRows) {
        const v2PrimaryMap = this.readLocalMap(this.ledgerKey);
        const v2LegacyMap = this.readLocalMap(this.legacyLedgerKey);
        const v1Map = this.readLocalMap(this.fallbackKey);
        const mapByUser = new Map();

        (dbRows || []).forEach(row => {
          const uname = (row.username || '').toString().trim().replace(/^@/, '');
          if (!uname) return;
          const k = uname.toLowerCase();
          const c2 = v2PrimaryMap[k] || v2LegacyMap[k] || {};
          const c1 = v1Map[k] || {};

          const dbUpdatedMs = this.parseTimestampMs(row.updated_at);
          const localUpdatedMs = Math.max(
            this.parseTimestampMs(c2.updated_at || c2.ts),
            this.parseTimestampMs(c1.updated_at || c1.ts)
          );

          const isExplicitZeroReset = Boolean(c2.isReset || c2.isRefunded || localUpdatedMs > dbUpdatedMs);

          const buyerBal = isExplicitZeroReset
            ? this.toExact(c2.buyer_deposit_balance ?? row.buyer_deposit_balance ?? 0)
            : Math.max(
                this.toExact(row.buyer_deposit_balance ?? 0),
                this.toExact(c2.buyer_deposit_balance ?? 0),
                this.toExact(c1.buyer_deposit_balance ?? 0)
              );

          const sellerBal = isExplicitZeroReset
            ? this.toExact(c2.seller_deposit_balance ?? row.seller_deposit_balance ?? 0)
            : Math.max(
                this.toExact(row.seller_deposit_balance ?? 0),
                this.toExact(c2.seller_deposit_balance ?? 0),
                this.toExact(c1.seller_deposit_balance ?? 0)
              );

          const totalBal = this.addExact(buyerBal, sellerBal);
          const walletVal = (row.wallet_address || row.wallet || c2.wallet_address || c1.wallet_address || '-').toString().trim();

          mapByUser.set(k, {
            ...c1,
            ...c2,
            ...row,
            username: uname,
            seller_deposit_balance: sellerBal,
            buyer_deposit_balance: buyerBal,
            deposit_balance: totalBal,
            wallet_address: walletVal,
            wallet: walletVal
          });
        });

        const combinedLocalRecords = {
          ...v1Map,
          ...v2LegacyMap,
          ...v2PrimaryMap
        };

        Object.values(combinedLocalRecords).forEach(cRec => {
          if (!cRec || typeof cRec !== 'object') return;
          const uname = (cRec.username || '').toString().trim().replace(/^@/, '');
          if (!uname) return;
          const k = uname.toLowerCase();
          if (!mapByUser.has(k)) {
            const sellerBal = this.toExact(cRec.seller_deposit_balance ?? 0);
            const buyerBal = this.toExact(cRec.buyer_deposit_balance ?? 0);
            const totalBal = this.addExact(buyerBal, sellerBal);
            const walletVal = (cRec.wallet_address || cRec.wallet || '-').toString().trim();
            mapByUser.set(k, {
              ...cRec,
              username: uname,
              seller_deposit_balance: sellerBal,
              buyer_deposit_balance: buyerBal,
              deposit_balance: totalBal,
              wallet_address: walletVal,
              wallet: walletVal
            });
          }
        });

        return Array.from(mapByUser.values()).sort((a, b) => (a.username || '').localeCompare(b.username || ''));
      },

      scheduleLiveRefresh: function() {
        if (syncDebounceTimer) {
          clearTimeout(syncDebounceTimer);
        }
        syncDebounceTimer = setTimeout(() => {
          syncDebounceTimer = null;
          fetchBuyersList();
        }, 60);
      },

      initLiveSync: function() {
        try {
          if (typeof BroadcastChannel !== 'undefined') {
            const bc1 = new BroadcastChannel('pibox_collateral_claim_channel');
            const bc2 = new BroadcastChannel('pibox_collateral_unified_sync_v1');
            const handleMsg = () => { this.scheduleLiveRefresh(); };
            bc1.onmessage = handleMsg;
            bc2.onmessage = handleMsg;
          }
        } catch (_) {}

        window.addEventListener('storage', (ev) => {
          if (
            ev.key === this.ledgerKey ||
            ev.key === this.legacyLedgerKey ||
            ev.key === this.fallbackKey ||
            ev.key === 'pibox_collateral_claim_room_v1'
          ) {
            this.scheduleLiveRefresh();
          }
        });

        if (supabaseClient) {
          try {
            this.channel = supabaseClient
              .channel('buyers-table-live-sync')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'buyers' }, () => {
                this.scheduleLiveRefresh();
              })
              .on('broadcast', { event: 'collateral_claim_sync' }, () => {
                this.scheduleLiveRefresh();
              })
              .on('broadcast', { event: 'collateral_unified_sync' }, () => {
                this.scheduleLiveRefresh();
              })
              .subscribe();
          } catch (_) {}
        }
      }
    };

    _BuyersTableSyncGuardian.initLiveSync();

    async function fetchBuyersList() {
      const currentReqId = ++fetchSequenceId;
      const localMerged = _BuyersTableSyncGuardian.mergeWithLocalLedger([]);
      if (localMerged.length > 0 && buyersList.length === 0) {
        buyersList = localMerged;
        renderBuyersTable();
      }
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('buyers')
          .select('*')
          .order('username', { ascending: true });

        if (error) throw error;
        if (currentReqId !== fetchSequenceId) return;

        buyersList = _BuyersTableSyncGuardian.mergeWithLocalLedger(data || []);
        renderBuyersTable();
      } catch (err) {
        console.error("Failed to load buyers list:", err.message);
      }
    }

    async function resetCollateralBalanceByAdmin(username) {
      const currentUsr = authenticatedPiUser ? authenticatedPiUser.username : '';
      try {
        _BuyersAccessGuardian.enforceAccess(currentUsr);
        const cleanUser = (username || '').toString().trim().replace(/^@/, '');
        if (!cleanUser) return;
        if (!confirm(`Reset Seller Collateral & Buyer Collateral untuk @${cleanUser} menjadi 0 Pi?`)) return;

        const nowIso = new Date().toISOString();
        const zeroState = {
          username: cleanUser,
          seller_deposit_balance: 0,
          buyer_deposit_balance: 0,
          deposit_balance: 0,
          status: 'pending',
          manual_approved: false,
          isReset: true,
          updated_at: nowIso,
          ts: Date.now()
        };

        _BuyersTableSyncGuardian.writeLocalRecord(cleanUser.toLowerCase(), zeroState);

        if (supabaseClient) {
          const { error } = await supabaseClient
            .from('buyers')
            .update({
              seller_deposit_balance: 0,
              buyer_deposit_balance: 0,
              deposit_balance: 0,
              status: 'pending',
              manual_approved: false,
              updated_at: nowIso
            })
            .eq('username', cleanUser);

          if (error && /buyer_deposit_balance|seller_deposit_balance|manual_approved|updated_at|column/i.test(error.message || '')) {
            const fb = await supabaseClient
              .from('buyers')
              .update({ deposit_balance: 0, status: 'pending' })
              .eq('username', cleanUser);
            if (fb.error) throw fb.error;
          } else if (error) {
            throw error;
          }

          try {
            await supabaseClient.channel('buyers-table-live-sync').send({
              type: 'broadcast',
              event: 'collateral_unified_sync',
              payload: { record: zeroState, ts: zeroState.ts }
            });
          } catch (_) {}
        }

        try {
          if (typeof BroadcastChannel !== 'undefined') {
            const bc = new BroadcastChannel('pibox_collateral_unified_sync_v1');
            bc.postMessage({ type: 'collateral_reset', record: zeroState, ts: zeroState.ts });
            bc.close();
          }
        } catch (_) {}

        await fetchBuyersList();
        alert(`Seller Collateral & Buyer Collateral untuk @${cleanUser} telah direset ke 0 Pi.`);
      } catch (err) {
        alert(err.message);
      }
    }

    const ADMIN_USERNAMES = ["ful21"];

    function isAdminAuthenticated() {
      const activeUser =
        typeof getActiveAuthenticatedUser === "function"
          ? normalizeCollateralUsername(getActiveAuthenticatedUser())
          : normalizeCollateralUsername(
              window.authenticatedPiUser && window.authenticatedPiUser.username
            );

      if (!activeUser) return false;
      return ADMIN_USERNAMES.includes(activeUser.toLowerCase());
    }

    function enforceAdminOnlyAccess(showAlert = true) {
      const allowed = isAdminAuthenticated();
      if (!allowed && showAlert) {
        alert("Akses menu ini khusus untuk admin.");
      }
      return allowed;
    }

    function syncBuyerVerificationPanelVisibility() {
      const panel =
        document.getElementById("buyerVerificationModal") ||
        document.getElementById("buyersVerificationPanel") ||
        document.querySelector("[data-admin-buyers-panel='true']");

      if (!panel) return;
      panel.style.display = isAdminAuthenticated() ? "" : "none";
    }

    async function fetchBuyersListFast() {
      if (!Array.isArray(window.buyersList)) {
        window.buyersList = [];
      }

      if (typeof readCollateralCache === "function" && window.buyersList.length === 0) {
        try {
          const cached = readCollateralCache();
          if (Array.isArray(cached) && cached.length > 0) {
            window.buyersList = cached.map((row) => standardizeBuyerCollateralRecord(row));
          }
        } catch (_) {}
      }

      if (typeof renderBuyersTable === "function") {
        renderBuyersTable();
      }

      if (!supabaseClient) {
        return window.buyersList;
      }

      try {
        const queryPromise = supabaseClient
          .from("buyers")
          .select("*")
          .order("username", { ascending: true });

        const timeoutPromise = new Promise((resolve) =>
          setTimeout(() => resolve({ data: null, timedOut: true }), 4000)
        );

        const result = await Promise.race([queryPromise, timeoutPromise]);
        if (result && Array.isArray(result.data)) {
          window.buyersList = result.data.map((row) =>
            standardizeBuyerCollateralRecord(row)
          );
          if (typeof renderBuyersTable === "function") {
            renderBuyersTable();
          }
        }
      } catch (_) {}

      return window.buyersList;
    }

    document.addEventListener("DOMContentLoaded", () => {
      syncBuyerVerificationPanelVisibility();
      syncBuyerRegisterButtonState();
      if (isAdminAuthenticated()) {
        fetchBuyersListFast();
      }
    });

    
    function escapeHtmlAttr(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatBuyerTableRowDisplay(rawRow = {}) {
      const item = standardizeBuyerCollateralRecord(rawRow);
      const formattedUsername = item.username ? `@${item.username}` : "-";
      const sellerCollateralText = `${_HighPrecisionDepositLedgerCore.formatPrecision(
        item.seller_deposit_balance
      )} Pi`;
      const buyerCollateralText = `${_HighPrecisionDepositLedgerCore.formatPrecision(
        item.buyer_deposit_balance
      )} Pi`;

      return {
        username: formattedUsername,
        rawUsername: item.username,
        sellerCollateralText,
        buyerCollateralText,
        status: item.status,
        role: item.role
      };
    }

      const tbody = document.getElementById('buyersTableBody');
      const batchContainer = document.getElementById('adminDeleteBatchContainer');
      const searchInput = document.getElementById('searchBuyerInput');
      const query = (searchInput?.value || '').toLowerCase().trim();

      if (!tbody) return;

      const currentUsr = authenticatedPiUser ? authenticatedPiUser.username : '';
      const isAdminOrDev = _BuyersAccessGuardian.verifyAdminAction(currentUsr);

      if (isAdminOrDev && batchContainer) {
        batchContainer.classList.remove('hidden');
      }

      const filtered = buyersList.filter(b => (b.username || '').toLowerCase().includes(query));

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-gray-500">Tidak ada data pembeli ditemukan.</td></tr>`;
        return;
      }

      const htmlChunks = [];
      filtered.forEach((b) => {
        const username = (b.username || 'Unknown').toString();
        const safeUsernameAttr = escapeHtmlAttr(username);
        const sellerBal = Math.min(35, _BuyersTableSyncGuardian.toExact(b.seller_deposit_balance ?? 0));
        const buyerBal = Math.min(35, _BuyersTableSyncGuardian.toExact(b.buyer_deposit_balance ?? 0));
        const status = (b.status || 'pending').toLowerCase();
        const hasWithdrawalReq = Boolean(b.has_requested_withdrawal);
        const rawRole = (b.role || b.keterangan || '').toString().toLowerCase().trim();
        const roleLabel = (rawRole === 'penjual & pembeli' || rawRole === 'pembeli & penjual' || rawRole === 'both' || rawRole === 'seller & buyer')
          ? 'Penjual & Pembeli'
          : ((rawRole === 'penjual' || rawRole === 'seller') ? 'Penjual' : ((rawRole === 'pembeli' || rawRole === 'buyer') ? 'Pembeli' : 'Belum Ditentukan'));
        const walletAddress = (b.wallet_address || b.wallet || '-').toString();
        const safeWalletAttr = escapeHtmlAttr(walletAddress);

        let statusBadge = `<span class="px-2 py-0.5 rounded text-[9px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/40">PENDING</span>`;
        if (status === 'approved' || status === 'aktif' || status === 'active' || buyerBal >= 35 || sellerBal >= 35) {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[9px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">AKTIF</span>`;
        }

        let actionButtons = '';
        if (isAdminOrDev) {
          const nextStatus = (status === 'approved' || status === 'aktif' || status === 'active' || buyerBal >= 35 || sellerBal >= 35) ? 'pending' : 'approved';
          const btnText = nextStatus === 'approved' ? 'Verifikasi' : 'Pending-kan';
          const btnClass = nextStatus === 'approved' ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-amber-600 hover:bg-amber-500 text-white';

          actionButtons = `
            <div class="flex flex-wrap gap-1 justify-end">
              <button type="button" data-username="${safeUsernameAttr}" onclick="resetCollateralBalanceByAdmin(this.dataset.username)" class="bg-purple-700 hover:bg-purple-600 text-white font-bold px-2 py-1 rounded-lg text-[10px] transition cursor-pointer">Reset Saldo</button>
              <button type="button" data-username="${safeUsernameAttr}" data-next-status="${escapeHtmlAttr(nextStatus)}" onclick="updateBuyerStatus(this.dataset.username, this.dataset.nextStatus)" class="${btnClass} font-bold px-2.5 py-1 rounded-lg text-[10px] transition cursor-pointer">${btnText}</button>
              <button type="button" data-username="${safeUsernameAttr}" onclick="deleteBuyerRecord(this.dataset.username)" class="bg-red-600 hover:bg-red-500 text-white font-bold px-2.5 py-1 rounded-lg text-[10px] transition cursor-pointer">Hapus</button>
            </div>
          `;
        } else {
          actionButtons = `<span class="text-gray-500 text-[10px]">Terkunci (Admin)</span>`;
        }

        let withdrawalAction = '<span class="text-gray-500">-</span>';
        if (hasWithdrawalReq) {
          if (isAdminOrDev) {
            withdrawalAction = `<button type="button" data-username="${safeUsernameAttr}" onclick="processWithdrawalRefund(this.dataset.username)" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-2 py-1 rounded-lg text-[9px] transition cursor-pointer">Kirim Refund</button>`;
          } else {
            withdrawalAction = `<span class="text-amber-400 font-bold text-[9px]">Menunggu Refund</span>`;
          }
        }

        htmlChunks.push(`
          <tr class="border-b border-gray-800/80 hover:bg-gray-900/50 transition">
            <td class="p-2.5 text-center w-8 bg-gray-950 sticky left-0 z-20 border-r border-gray-800"><input type="checkbox" class="buyer-checkbox accent-yellow-500 cursor-pointer" value="${safeUsernameAttr}"></td>
            <td class="p-2.5 font-mono text-yellow-400 bg-gray-950 sticky left-8 z-20 border-r border-gray-800 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">@${escapeHtmlAttr(username)}</td>
            <td class="p-2.5 text-center font-mono text-amber-300 font-bold">${sellerBal} Pi</td>
            <td class="p-2.5 text-center font-mono text-emerald-400 font-bold">${buyerBal} Pi</td>
            <td class="p-2.5 text-center"><span class="px-2 py-0.5 rounded text-[9px] font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">${escapeHtmlAttr(roleLabel)}</span></td>
            <td class="p-2.5">${statusBadge}</td>
            <td class="p-2.5 text-right">${actionButtons}</td>
            <td class="p-2.5 text-center">${withdrawalAction}</td>
            <td class="p-2.5">
              <div class="flex items-center gap-1.5 min-w-[155px]">
                <input type="text" readonly value="${safeWalletAttr}" aria-label="Wallet Pengguna" class="bg-gray-950 border border-gray-800 rounded px-2 py-1 text-[10px] font-mono text-gray-200 w-28 select-all focus:outline-none cursor-default">
                <button type="button" data-wallet="${safeWalletAttr}" onclick="copyBuyerWallet(this.dataset.wallet, this)" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 px-2 py-1 rounded text-[9px] font-bold border border-gray-700 cursor-pointer">📋 Copy</button>
              </div>
            </td>
          </tr>
        `);
      });

      tbody.innerHTML = htmlChunks.join('');
    }

    function copyBuyerWallet(walletAddr, btnEl) {
      if (!walletAddr || walletAddr === '-') return;
      const done = () => {
        if (btnEl) {
          const oldLabel = btnEl.innerText;
          btnEl.innerText = '✓ Tersalin';
          setTimeout(() => { btnEl.innerText = oldLabel; }, 1400);
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(walletAddr).then(done).catch(() => {
          prompt('Salin alamat wallet pengguna:', walletAddr);
        });
      } else {
        prompt('Salin alamat wallet pengguna:', walletAddr);
      }
    }

    function toggleSelectAllBuyers(masterCheckbox) {
      const checkboxes = document.querySelectorAll('.buyer-checkbox');
      checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
    }

    async function updateBuyerStatus(username, newStatus) {
      const currentUsr = authenticatedPiUser ? authenticatedPiUser.username : '';
      try {
        _BuyersAccessGuardian.enforceAccess(currentUsr);
        if (!supabaseClient) throw new Error("Database tidak terhubung.");

        const { error } = await supabaseClient
          .from('buyers')
          .update({ status: newStatus, updated_at: new Date().toISOString() })
          .eq('username', username);

        if (error) throw error;
        alert(`✅ Status pembeli @${username} berhasil diubah menjadi: ${newStatus.toUpperCase()}`);
        await fetchBuyersList();
      } catch (err) {
        alert("Gagal memperbarui status: " + err.message);
      }
    }

    async function deleteBuyerRecord(username) {
      const currentUsr = authenticatedPiUser ? authenticatedPiUser.username : '';
      try {
        _BuyersAccessGuardian.enforceAccess(currentUsr);
        if (!confirm(`⚠️ Apakah Anda yakin ingin menghapus data pembeli @${username}?`)) return;
        if (!supabaseClient) throw new Error("Database tidak terhubung.");

        const { error } = await supabaseClient
          .from('buyers')
          .delete()
          .eq('username', username);

        if (error) throw error;
        alert(`🗑️ Data pembeli @${username} berhasil dihapus.`);
        await fetchBuyersList();
      } catch (err) {
        alert("Gagal menghapus pembeli: " + err.message);
      }
    }

    async function deleteSelectedBuyers() {
      const currentUsr = authenticatedPiUser ? authenticatedPiUser.username : '';
      try {
        _BuyersAccessGuardian.enforceAccess(currentUsr);
        const selected = Array.from(document.querySelectorAll('.buyer-checkbox:checked')).map(cb => cb.value);
        if (selected.length === 0) {
          alert("Pilih setidaknya satu pembeli yang ingin dihapus.");
          return;
        }

        if (!confirm(`⚠️ Hapus ${selected.length} data pembeli yang dipilih secara permanen?`)) return;
        if (!supabaseClient) throw new Error("Database tidak terhubung.");

        for (let uname of selected) {
          await supabaseClient.from('buyers').delete().eq('username', uname);
        }

        alert("🗑️ Data pembeli terpilih berhasil dihapus.");
        await fetchBuyersList();
      } catch (err) {
        alert("Gagal menghapus data: " + err.message);
      }
    }

    async function processWithdrawalRefund(username) {
      const currentUsr = authenticatedPiUser ? authenticatedPiUser.username : '';
      try {
        _BuyersAccessGuardian.enforceAccess(currentUsr);
        if (!confirm(`Proses pengembalian jaminan (refund) untuk @${username}?`)) return;
        if (!supabaseClient) throw new Error("Database tidak terhubung.");

        const cleanUser = (username || '').toString().trim().replace(/^@/, '');
        const nowIso = new Date().toISOString();
        const refundedState = {
          username: cleanUser,
          has_requested_withdrawal: false,
          seller_deposit_balance: 0.00,
          buyer_deposit_balance: 0.00,
          deposit_balance: 0.00,
          status: 'pending',
          isRefunded: true,
          updated_at: nowIso,
          ts: Date.now()
        };

        _BuyersTableSyncGuardian.writeLocalRecord(cleanUser.toLowerCase(), refundedState);

        const { error } = await supabaseClient
          .from('buyers')
          .update({
            has_requested_withdrawal: false,
            seller_deposit_balance: 0.00,
            buyer_deposit_balance: 0.00,
            deposit_balance: 0.00,
            status: 'pending',
            updated_at: nowIso
          })
          .eq('username', cleanUser);

        if (error) throw error;
        alert(`✅ Refund jaminan untuk @${cleanUser} berhasil disetujui & diselesaikan.`);
        await fetchBuyersList();
      } catch (err) {
        alert("Gagal memproses refund: " + err.message);
      }
    }
  </script>
</body>
