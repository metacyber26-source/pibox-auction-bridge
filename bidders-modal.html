<!-- MODAL TERPISAH: DAFTAR PENAWAR LELANG & FREKUENSI -->
<div id="activeBiddersModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
  <div class="bg-gray-950 border border-emerald-500/40 rounded-2xl p-4 sm:p-5 w-full max-w-md space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
      <div class="flex items-center gap-2">
        <span class="text-emerald-400 text-lg">🔨</span>
        <div>
          <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Daftar Penawar Lelang & Frekuensi</h2>
          <p class="text-[9px] text-gray-400">Urutan penawar pertama hingga terakhir beserta frekuensi</p>
        </div>
      </div>
      <button type="button" onclick="closeActiveBiddersModal()" class="text-gray-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
    </div>

    <div id="adminResetBiddersContainer" class="hidden">
      <button type="button" onclick="adminResetSelectedOrAllBidders()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-xl text-xs transition shadow cursor-pointer flex items-center justify-center gap-1.5">
        🗑️ [ADMIN/DEV] Hapus / Reset Penawar Terpilih
      </button>
    </div>

    <div class="border border-gray-800 rounded-xl overflow-hidden max-h-[50vh] flex flex-col">
      <div class="overflow-x-auto custom-scrollbar flex-1">
        <table class="w-full text-left text-[11px] text-gray-300 border-collapse">
          <thead class="bg-gray-900 text-gray-400 uppercase text-[9px] border-b border-gray-800 sticky top-0 z-20">
            <tr>
              <th class="p-2 text-center w-8">
                <input type="checkbox" id="selectAllBiddersCheckbox" onclick="toggleSelectAllBidders(this)" class="cursor-pointer accent-emerald-500" title="Pilih Semua">
              </th>
              <th class="p-2">Username Penawar</th>
              <th class="p-2 text-center">Jumlah Menawar</th>
            </tr>
          </thead>
          <tbody id="activeBiddersModalTableBody">
            <tr><td colspan="3" class="p-4 text-center text-gray-500">Memuat data penawar...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <button type="button" onclick="closeActiveBiddersModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-gray-300 font-semibold py-2 rounded-xl text-xs cursor-pointer">
      Tutup
    </button>
  </div>
</div>
