<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusantara NFT Auction Engine & NFT-GM Certificate</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- LAPISAN KEAMANAN TINGKAT LANJUT & COGNITIVE ENGINE -->
  <script>
    (function() {
      const devtoolsCheck = function() {};
      devtoolsCheck.toString = function() { return ''; };
    })();

    window.SecureShield = {
      sanitizeHTML: function(str) {
        if (!str) return '';
        return str.toString()
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },
      maskUsername: function(username) {
        if (!username) return 'Anon***';
        const clean = username.toString().trim();
        const len = clean.length;
        if (len <= 2) return clean[0] + '*';
        const maskLength = Math.max(1, Math.floor(len * 0.75));
        const startIdx = Math.floor((len - maskLength) / 2);
        let masked = '';
        for (let i = 0; i < len; i++) {
          masked += (i >= startIdx && i < startIdx + maskLength) ? '*' : clean[i];
        }
        return masked;
      },
      extractTitleFromSSVision: function(file, callback) {
        setTimeout(() => {
          let detectedTitle = "Nusantara NFT Asset " + Math.floor(Math.random() * 9000 + 1000);
          if (file && file.name) {
            let rawName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            if (rawName && !/^\d+$/.test(rawName)) {
              detectedTitle = rawName.replace(/[-_]/g, ' ').trim();
            }
          }
          if (typeof callback === 'function') callback(detectedTitle);
        }, 100);
      }
    };
  </script>

  <style>
    body { background-color: #0b0f17; color: #f3f4f6; font-family: system-ui, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .input-error { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.1) !important; }
    .input-success { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.1) !important; }
  </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-start p-2 sm:p-4">

  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col min-h-[90vh]">
    
    <!-- Banner Mode Jaringan -->
    <div id="networkModeBanner" class="bg-amber-600/90 text-gray-950 font-black text-[10px] tracking-widest text-center py-1 uppercase shadow-md flex items-center justify-center gap-1.5">
      <span>⚡ NETWORK MODE:</span>
      <span id="networkModeBadge" class="bg-black text-yellow-400 px-1.5 py-0.5 rounded border border-yellow-400/40">TESTNET</span>
    </div>

    <!-- Top Header Bar -->
    <div class="bg-gray-950 p-3 sm:p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 z-30">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
        <div>
          <h1 class="font-bold text-xs sm:text-sm tracking-wide text-gray-200">NUSANTARA NFT AUCTION</h1>
          <p class="text-[9px] text-yellow-500">PiBox Bridge v4.9 + Secure Engine</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 sm:gap-2">
        <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-gray-900 text-yellow-400 border border-yellow-500/30 text-[10px] font-bold py-1 px-1.5 rounded-lg focus:outline-none cursor-pointer">
          <option value="id">🇮🇩 ID</option>
          <option value="en">🇺🇸 EN</option>
        </select>

        <button id="btnHeaderLogin" onclick="authenticatePiUser()" class="text-xs bg-gray-800 hover:bg-gray-700 text-yellow-400 font-semibold px-2 py-1.5 rounded-xl border border-yellow-500/30 transition flex items-center gap-1 cursor-pointer">
          🔑 <span data-i18n="loginBtn">Login</span>
        </button>
        
        <button id="btnHeaderCreate" onclick="handleOpenCreateModal()" class="text-xs bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold px-2.5 py-1.5 rounded-xl transition duration-200 shadow-lg flex items-center gap-1 cursor-pointer">
          <span data-i18n="releaseAssetBtn">+ List Asset</span>
        </button>
      </div>
    </div>

    <!-- Banner Sesi Lelang (Buka Terus Selama Uji Coba) -->
    <div id="sessionBanner" class="bg-gradient-to-r from-purple-900/60 via-indigo-900/60 to-gray-900 border-b border-purple-500/30 p-2.5 text-center space-y-1">
      <div class="flex justify-between items-center px-1">
        <span class="text-[10px] font-bold text-purple-300 uppercase tracking-wider">⏳ SELANG LELANG:</span>
        <span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
          BUKA TERUS (24/7 LIVE)
        </span>
      </div>
      <p class="text-xs font-mono font-bold text-yellow-300">Uji Coba Aktif: Aset Terus Berjalan & Penawaran Terbuka!</p>
    </div>

    <!-- Panel Filter & Pencarian -->
    <div class="p-2.5 bg-gray-950/60 border-b border-gray-800 flex gap-2">
      <input type="text" id="searchInput" oninput="filterGallery()" placeholder="🔍 Cari nama NFT / Hash..." class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-2.5 py-1.5 text-[11px] text-white focus:outline-none focus:border-yellow-500">
      <select id="statusFilter" onchange="filterGallery()" class="bg-gray-900 border border-gray-800 text-gray-300 text-[10px] font-semibold px-2 py-1.5 rounded-xl focus:outline-none cursor-pointer">
        <option value="all">Semua Status</option>
        <option value="active">Aktif</option>
        <option value="pending">⏳ Pending (Admin/Dev)</option>
        <option value="my_listings">📦 Aset Saya</option>
        <option value="ended">Selesai & Sertifikat</option>
      </select>
    </div>

    <!-- Galeri Content -->
    <div id="mainContent" class="p-4 flex-1 flex flex-col custom-scrollbar overflow-y-auto">
      <div class="text-center py-10 text-gray-500 text-xs animate-pulse">Memuat Galeri Aset...</div>
    </div>

    <!-- Bottom Footer dengan Tombol Refresh Agresif & Kuat -->
    <div class="bg-gray-950 p-3 border-t border-gray-800 text-center text-[10px] text-gray-500 flex justify-between items-center">
      <span id="userStatusDisplay">User: Tamu (Belum Login)</span>
      <button onclick="triggerAggressiveRefresh()" class="bg-yellow-500/20 hover:bg-yellow-500/40 text-yellow-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-yellow-500/40 transition cursor-pointer flex items-center gap-1.5">
        🔄 <span id="refreshTextBtn">Refresh Super Cepat</span>
      </button>
    </div>

  </div>

  <!-- MODAL: Detail & Penawaran -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
    <div class="bg-gray-950 border border-gray-800 rounded-2xl p-4 sm:p-5 w-full max-w-sm space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h2 class="text-xs font-bold text-gray-200 uppercase tracking-wider">Detail Lelang Aset</h2>
        <button onclick="closeDetailModal()" class="text-gray-400 hover:text-white font-bold text-xl cursor-pointer">&times;</button>
      </div>
      <div id="modalDetailContent"></div>
    </div>
  </div>

  <!-- MODAL: Buat Lelang / Rilis Aset -->
  <div id="createModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
    <div class="bg-gray-950 border border-gray-800 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h2 class="text-sm font-bold text-gray-100">Rilis Lelang NFT Baru</h2>
        <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white font-bold text-lg cursor-pointer">&times;</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Upload Gambar Aset (SS Utama)</label>
          <input type="file" id="imageFileInput" accept="image/*" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-gray-300 file:bg-yellow-500 file:text-gray-950 file:rounded-lg file:border-0 file:font-bold cursor-pointer">
        </div>
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Nama / Judul Aset NFT</label>
          <input type="text" id="assetTitleInput" placeholder="Masukkan judul aset..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Hash NFT</label>
          <input type="text" id="assetHashInput" placeholder="Contoh: GCVJ2EXX..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs font-mono text-yellow-400 focus:outline-none">
        </div>
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Harga Awal (Reserve Price in Pi)</label>
          <input type="number" step="0.01" id="reservePriceInput" value="100" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none">
        </div>
      </div>
      <div class="flex flex-col gap-2 pt-2">
        <button type="button" onclick="releaseToGalleryOnly()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 rounded-xl transition cursor-pointer shadow-lg">
          🚀 Rilis ke Galeri (Status: Pending)
        </button>
        <button type="button" onclick="closeCreateModal()" class="w-full bg-gray-900 text-gray-400 text-xs py-2 rounded-xl transition cursor-pointer">Batal</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT UTAMA & INTEGRASI SUPABASE -->
  <script>
    const SUPABASE_URL = "https://lgxvdqveblueuadocimv.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_TBKKXJkwiqMmAYJKqAdwgw__nqQA8xJ";
    const ADMIN_USERNAMES = ["Ful21", "Muhammadefendi123"];

    let supabaseClient = null;
    let Pi = window.Pi || null;
    let activeAuctionsList = [];
    let authenticatedPiUser = null;
    let selectedAuction = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error("Supabase Init Error:", e);
    }

    document.addEventListener("DOMContentLoaded", () => {
      triggerAggressiveRefresh();
      authenticatePiUser();
    });

    // 🔄 TOMBOL REFRESH SUPER AGENSI & KUAT
    async function triggerAggressiveRefresh() {
      const btnText = document.getElementById('refreshTextBtn');
      if (btnText) btnText.innerText = "Menyegarkan...";
      
      await fetchActiveAuctions();
      
      if (btnText) {
        btnText.innerText = "Refresh Super Cepat";
      }
    }

    async function fetchActiveAuctions() {
      const container = document.getElementById('mainContent');
      if (!supabaseClient) {
        container.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">Database belum terhubung dengan benar. Periksa konfigurasi Supabase Anda.</div>`;
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('auctions')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        activeAuctionsList = data || [];
        filterGallery();
      } catch (err) {
        console.error("Fetch Error:", err);
        container.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">Gagal memuat galeri database. Pastikan tabel 'auctions' sudah dibuat di Supabase.</div>`;
      }
    }

    function filterGallery() {
      const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const status = document.getElementById('statusFilter')?.value || 'all';
      const isAdminUser = authenticatedPiUser && ADMIN_USERNAMES.includes(authenticatedPiUser.username);

      const filtered = activeAuctionsList.filter(item => {
        const isPending = item.status === 'pending';
        const matchSearch = (item.title || '').toLowerCase().includes(query) || (item.hash || '').toLowerCase().includes(query);
        const isMyListing = authenticatedPiUser && item.seller === authenticatedPiUser.username;

        if (isPending && !isAdminUser && !isMyListing) return false;

        if (status === 'active') return matchSearch && item.status === 'active';
        if (status === 'pending') return matchSearch && isPending;
        if (status === 'my_listings') return matchSearch && isMyListing;
        return matchSearch;
      });

      renderGalleryUI(filtered);
    }

    function renderGalleryUI(auctions) {
      const container = document.getElementById('mainContent');
      if (!auctions || auctions.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">Belum ada aset NFT yang terdaftar di galeri.</div>`;
        return;
      }

      let html = `<div class="grid grid-cols-2 gap-3">`;
      auctions.forEach(item => {
        const title = SecureShield.sanitizeHTML(item.title) || "NFT Asset";
        const seller = SecureShield.maskUsername(item.seller);
        const price = item.highest_bid > 0 ? item.highest_bid : item.reserve_price;
        const isPending = item.status === 'pending';

        html += `
          <div onclick="openDetailModal('${item.id}')" class="bg-gray-950 border border-gray-800 hover:border-yellow-500/50 rounded-xl overflow-hidden flex flex-col cursor-pointer transition">
            <div class="relative w-full h-36 bg-gray-900">
              <img src="${item.image_url || 'https://via.placeholder.com/200'}" class="w-full h-full object-cover">
              <span class="absolute top-1.5 left-1.5 bg-black/70 px-1.5 py-0.5 rounded text-[8px] ${isPending ? 'text-amber-400' : 'text-yellow-400'} font-semibold">
                ${isPending ? '⏳ Pending' : '🔥 Aktif 24/7'}
              </span>
            </div>
            <div class="p-2.5 flex-1 flex flex-col justify-between">
              <h3 class="text-[11px] font-bold text-gray-200 truncate">${title}</h3>
              <p class="text-[9px] text-gray-500">Penjual: ${seller}</p>
              <div class="mt-1 flex justify-between items-center">
                <span class="text-xs font-bold text-yellow-400">${price} Pi</span>
                <span class="text-[9px] text-emerald-400 font-semibold">Lelang Buka</span>
              </div>
            </div>
          </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    async function authenticatePiUser() {
      if (!window.Pi) return;
      try {
        const auth = await window.Pi.authenticate(['username', 'payments'], () => {});
        authenticatedPiUser = auth.user;
        document.getElementById('userStatusDisplay').innerText = `User: @${authenticatedPiUser.username}`;
        document.getElementById('btnHeaderLogin').innerHTML = `✅ <span class="text-emerald-400">@${authenticatedPiUser.username}</span>`;
        filterGallery();
      } catch (e) {
        console.warn("Pi Auth warning");
      }
    }

    function handleOpenCreateModal() {
      if (!authenticatedPiUser) {
        alert("Silakan login akun Pi Network terlebih dahulu!");
        authenticatePiUser();
        return;
      }
      document.getElementById('createModal').classList.remove('hidden');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
    }

    async function releaseToGalleryOnly() {
      const title = document.getElementById('assetTitleInput').value.trim();
      const hash = document.getElementById('assetHashInput').value.trim() || "HASH-TESTNET-2026";
      const reservePrice = parseFloat(document.getElementById('reservePriceInput').value) || 100;
      const fileInput = document.getElementById('imageFileInput');

      if (!title || !fileInput.files[0]) {
        alert("Lengkapi judul dan pilih gambar aset terlebih dahulu!");
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        const imageUrl = e.target.result;
        const seller = authenticatedPiUser ? authenticatedPiUser.username : "Dev";
        const endsAt = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();

        const { error } = await supabaseClient.from('auctions').insert([{
          title, hash, image_url: imageUrl, reserve_price: reservePrice, seller, status: 'pending', ends_at: endsAt
        }]);

        if (error) {
          alert("Gagal merilis ke database: " + error.message);
        } else {
          alert("🎉 Aset berhasil dirilis dengan status Pending! Menunggu verifikasi admin.");
          closeCreateModal();
          triggerAggressiveRefresh();
        }
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    async function openDetailModal(id) {
      selectedAuction = activeAuctionsList.find(a => a.id === id);
      if (!selectedAuction) return;

      const isAdminUser = authenticatedPiUser && ADMIN_USERNAMES.includes(authenticatedPiUser.username);
      const isPending = selectedAuction.status === 'pending';

      const modalContent = document.getElementById('modalDetailContent');
      modalContent.innerHTML = `
        <div class="space-y-3">
          <img src="${selectedAuction.image_url}" class="w-full h-40 object-contain rounded-xl bg-black">
          <div>
            <h3 class="text-sm font-bold text-gray-100">${SecureShield.sanitizeHTML(selectedAuction.title)}</h3>
            <p class="text-xs text-gray-400">Penjual: @${SecureShield.maskUsername(selectedAuction.seller)}</p>
          </div>
          <div class="bg-gray-900 p-2.5 rounded-xl border border-gray-800 text-xs space-y-1">
            <p>Harga Awal: <span class="font-bold text-yellow-400">${selectedAuction.reserve_price} Pi</span></p>
            <p class="font-mono text-[10px] text-yellow-500 truncate">Hash: ${selectedAuction.hash}</p>
          </div>

          ${isPending && isAdminUser ? `
            <button onclick="approvePendingAsset('${selectedAuction.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl transition cursor-pointer">
              ✅ Admin: Set Aktifkan Aset
            </button>
          ` : ''}

          <!-- 🛡️ TOMBOL DELETE KHUSUS ADMIN YANG KUAT -->
          ${isAdminUser ? `
            <div class="pt-2 border-t border-gray-800">
              <button onclick="deleteAuctionForever('${selectedAuction.id}')" class="w-full bg-red-600 hover:bg-red-500 text-white text-xs font-bold py-2.5 rounded-xl transition cursor-pointer shadow-lg flex items-center justify-center gap-1">
                🗑️ Admin: Hapus Permanen (Strong Delete)
              </button>
            </div>
          ` : ''}
        </div>`;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    async function approvePendingAsset(id) {
      const { error } = await supabaseClient.from('auctions').update({ status: 'active' }).eq('id', id);
      if (error) alert("Gagal mengaktifkan: " + error.message);
      else {
        alert("✅ Aset berhasil diaktifkan dan langsung tayang di galeri!");
        closeDetailModal();
        triggerAggressiveRefresh();
      }
    }

    // Fungsi Delete Khusus Admin yang Kuat & Permanen
    async function deleteAuctionForever(id) {
      if (!confirm("⚠️ PERINGATAN KERAS ADMIN:\nApakah Anda yakin ingin menghapus aset ini secara permanen dari database?")) return;

      const { error } = await supabaseClient.from('auctions').delete().eq('id', id);
      if (error) {
        alert("Gagal menghapus aset: " + error.message);
      } else {
        alert("🗑️ Aset berhasil dihapus secara permanen dari database.");
        closeDetailModal();
        triggerAggressiveRefresh();
      }
    }
  </script>
</body>
</html>
