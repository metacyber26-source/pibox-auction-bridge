<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusantara NFT Auction Engine & GCP2E Certificate</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      background-color: #0b0f17;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-start p-2 sm:p-4">

  <!-- Main Container -->
  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col min-h-[90vh]">
    
    <!-- Top Header Bar -->
    <div class="bg-gray-950 p-3 sm:p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 z-30">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
        <div>
          <h1 class="font-bold text-xs sm:text-sm tracking-wide text-gray-200">NUSANTARA NFT AUCTION</h1>
          <p class="text-[9px] text-yellow-500">PiBox Bridge v4.0 + GCP2E Cert Module</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btnHeaderLogin" onclick="authenticatePiUser()" class="text-xs bg-gray-800 hover:bg-gray-700 text-yellow-400 font-semibold px-2 py-1.5 rounded-xl border border-yellow-500/30 transition flex items-center gap-1 cursor-pointer">
          🔑 <span>Login</span>
        </button>
        
        <button id="btnHeaderCreate" onclick="handleOpenCreateModal()" class="text-xs bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold px-2.5 py-1.5 rounded-xl transition duration-200 shadow-lg flex items-center gap-1 cursor-pointer">
          <span>+ List Asset</span>
        </button>
      </div>
    </div>

    <!-- Galeri Content -->
    <div id="mainContent" class="p-4 flex-1 flex flex-col custom-scrollbar overflow-y-auto">
      <div class="text-center py-10 text-gray-500 text-xs animate-pulse">Memuat Galeri Aset...</div>
    </div>

  </div>

  <!-- MODAL: Buat Lelang dengan 2 Tombol (Hijau & Kuning yang Disempurnakan) -->
  <div id="createModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 z-50">
    <div class="bg-gray-950 border border-gray-800 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <div>
          <h2 class="text-sm font-bold text-gray-100">Rilis Lelang NFT Baru</h2>
          <p class="text-[10px] text-yellow-400 font-medium">Input Judul, Hash, & Upload SS Pendukung</p>
        </div>
        <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white font-bold text-lg cursor-pointer">&times;</button>
      </div>

      <div class="space-y-3 text-xs">
        <!-- 1. Input Judul -->
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Input Judul (NFT Asset Name)</label>
          <input type="text" id="assetTitleInput" placeholder="Contoh: Nusantara Art #1" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-yellow-500 transition">
        </div>

        <!-- 2. Input Hash -->
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Input Hash (PiBox Mint/Tx Hash)</label>
          <input type="text" id="assetHashInput" placeholder="Contoh: GCVJ2EXX..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs font-mono text-yellow-400 focus:outline-none focus:border-yellow-500 transition">
        </div>

        <!-- 3. Upload SS Utama / Galeri -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 space-y-2">
          <label class="block font-semibold text-gray-200 text-[11px]">Upload SS Utama / Galeri</label>
          <input type="file" id="imageFileInput" accept="image/*" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-gray-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-yellow-500 file:text-gray-950 cursor-pointer">
        </div>

        <!-- 4. Upload 2 SS Pendukung -->
        <div class="bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-3 space-y-2">
          <label class="block font-bold text-indigo-300 text-[11px]">Upload 2 SS Pendukung (Smart Vision)</label>
          <input type="file" id="extraSSInput" accept="image/*" multiple max="2" onchange="handleExtraSSUpload(this)" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-2 text-xs text-gray-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-indigo-600 file:text-white cursor-pointer">
          <div id="extraSSPreviewList" class="flex gap-2 overflow-x-auto py-1"></div>
        </div>

        <!-- 5. Input Harga Awal -->
        <div>
          <label class="block font-semibold text-gray-300 mb-1">Input Harga Awal (Reserve Price in Pi)</label>
          <input type="number" step="0.01" id="reservePriceInput" placeholder="Contoh: 100" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-yellow-500 transition">
        </div>
      </div>

      <!-- TOMBOL PEMBAYARAN: Tombol Hijau & Tombol Kuning yang sudah disempurnakan kodenya -->
      <div class="flex flex-col gap-2 pt-2">
        <!-- Tombol Hijau (Metode Lancar) -->
        <button type="button" onclick="submitNewListingGreenBtn()" class="w-full bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer shadow-lg">
          🟢 Klik Rilis Aset + Bayar 0.2 Pi (Lancar) + Kirim WA
        </button>

        <!-- Tombol Kuning (Kode lama yang kini disamakan/disempurnakan dengan kode tombol hijau) -->
        <button type="button" onclick="submitNewListingYellowBtn()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 text-xs font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer shadow-lg">
          🟡 Klik Rilis Aset + Bayar 0.2 Pi (Versi Kuning - Disempurnakan) + Kirim WA
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT UTAMA -->
  <script>
    const IS_TESTNET = true;
    const SUPABASE_URL = "https://lgxvdqveblueuadocimv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_TBKKXJkwiqMmAYJKqAdwgw__nqQA8xJ";
    let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let authenticatedPiUser = null;
    let extraSSFiles = [];

    document.addEventListener("DOMContentLoaded", () => {
      authenticatePiUser();
    });

    async function authenticatePiUser() {
      if (!window.Pi) return;
      try {
        const auth = await window.Pi.authenticate(['username', 'payments'], (payment) => {
          console.log("Incomplete payment:", payment);
        });
        authenticatedPiUser = auth.user;
        document.getElementById('btnHeaderLogin').innerHTML = `✅ <span class="text-emerald-400">@${authenticatedPiUser.username}</span>`;
      } catch (err) {
        console.warn("Auth Error:", err);
      }
    }

    function handleOpenCreateModal() {
      if (!authenticatedPiUser) {
        alert("Silakan Login akun Pi Network terlebih dahulu!");
        authenticatePiUser();
        return;
      }
      document.getElementById('createModal').classList.remove('hidden');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
    }

    function handleExtraSSUpload(input) {
      if (input.files && input.files.length > 0) {
        if (input.files.length > 2) {
          alert("Maksimal hanya dapat mengunggah 2 Screenshot (SS).");
          input.value = "";
          return;
        }
        extraSSFiles = Array.from(input.files);
      }
    }

    function sendDataToWhatsAppDirectly(title, hash) {
      const waNumber = "6285708486588";
      const message = `Halo Admin GCP2E, berikut adalah data verifikasi aset NFT yang baru dirilis:\n\n` +
                      `1. Judul: ${title}\n` +
                      `2. Hash: ${hash}\n` +
                      `3. Creator: @${authenticatedPiUser ? authenticatedPiUser.username : 'Unknown'}\n\n` +
                      `Pembayaran 0.2 Pi Berhasil. Mohon persetujuannya. Terima kasih.`;
      
      const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }

    // Fungsi Pembayaran Tombol Hijau (Lancar)
    async function submitNewListingGreenBtn() {
      await executePaymentAndListingProcess("HIJAU");
    }

    // Fungsi Pembayaran Tombol Kuning yang telah disempurnakan dengan kode yang sama persis seperti tombol hijau
    async function submitNewListingYellowBtn() {
      await executePaymentAndListingProcess("KUNING (Disempurnakan)");
    }

    // Logika Inti Pembayaran Pi & Rilis Aset yang Dipindahkan
    async function executePaymentAndListingProcess(buttonType) {
      const title = document.getElementById('assetTitleInput').value.trim();
      const hash = document.getElementById('assetHashInput').value.trim();
      const reservePrice = document.getElementById('reservePriceInput').value.trim();
      const fileInput = document.getElementById('imageFileInput');

      if (!title || !hash || !reservePrice) {
        alert("Harap isi Judul, Hash, dan Harga Awal dengan lengkap!");
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Pilih file gambar/SS utama terlebih dahulu!");
        return;
      }

      if (!window.Pi) {
        alert("Pi SDK tidak tersedia. Pastikan Anda membukanya di Pi Browser.");
        return;
      }

      const listingFee = 0.2;
      const paymentData = {
        amount: listingFee,
        memo: `Nusantara NFT Listing Fee (${buttonType}) - ${title}`,
        metadata: { type: "listing_fee", title, hash, seller: authenticatedPiUser.username }
      };

      try {
        console.log(`Memproses pembayaran via Tombol ${buttonType}...`);
        
        window.Pi.createPayment({
          amount: paymentData.amount,
          memo: paymentData.memo,
          metadata: paymentData.metadata,
        }, {
          onReadyForServerApproval: async (paymentId) => {
            console.log("Ready for server approval:", paymentId);
          },
          onReadyForServerCompletion: async (paymentId, txid) => {
            console.log("Payment completed successfully via txid:", txid);
            
            // Simpan ke Database Supabase (Simulasi/Eksekusi)
            if (supabaseClient) {
              await supabaseClient.from('auctions').insert([{
                title: title,
                hash: hash,
                reserve_price: parseFloat(reservePrice),
                seller: authenticatedPiUser.username,
                image_url: "https://via.placeholder.com/400x300/111827/EAB308?text=" + encodeURIComponent(title),
                status: 'active',
                ends_at: new Date(new Date().getTime() + 24*60*60*1000).toISOString()
              }]);
            }

            alert(`🎉 Pembayaran 0.2 Pi Berhasil (${buttonType})! Aset NFT berhasil dirilis.`);
            closeCreateModal();

            // Klik Kirim WA Otomatis
            sendDataToWhatsAppDirectly(title, hash);
          },
          onCancel: (paymentId) => {
            alert("Pembayaran dibatalkan oleh pengguna.");
          },
          onError: (error, payment) => {
            console.error("Pi Payment Error:", error);
            alert("Terjadi kesalahan pada transaksi pembayaran: " + (error.message || error));
          }
        });

      } catch (err) {
        console.error("Error eksekusi pembayaran:", err);
        alert("Gagal memproses pembayaran: " + err.message);
      }
    }
  </script>
</body>
</html>
