<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusantara NFT Auction Engine</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #0b0f17;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

  <!-- Main Container Card -->
  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
    
    <!-- Top Header Bar -->
    <div class="bg-gray-950 p-4 border-b border-gray-800 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
        <h1 class="font-bold text-sm tracking-wide text-gray-200">NUSANTARA NFT AUCTION</h1>
      </div>
      <button onclick="openCreateModal()" class="text-xs bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-semibold px-3 py-1.5 rounded-lg transition duration-200 shadow-md">
        + Buat Lelang
      </button>
    </div>

    <!-- Active Auction View / Empty State Container -->
    <div id="auctionContent" class="p-5 flex-1 flex flex-col items-center justify-center">
      <p class="text-gray-500 text-sm animate-pulse">Memuat data lelang...</p>
    </div>

  </div>

  <!-- Modal Form Buat Lelang -->
  <div id="createModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-950 border border-gray-800 rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
      
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h2 class="text-base font-bold text-gray-100">Buat Lelang NFT Baru</h2>
        <button onclick="closeCreateModal()" class="text-gray-400 hover:text-white font-bold text-lg">&times;</button>
      </div>

      <div class="space-y-3">
        
        <!-- Step 1: Pilihan Link Upload Gambar -->
        <div class="bg-gray-900 border border-yellow-500/30 rounded-xl p-3 text-xs space-y-2">
          <p class="text-yellow-400 font-semibold">Langkah 1: Unggah SS Aset ke Cloud</p>

          <p class="text-gray-300 leading-relaxed">
            Pilih salah satu layanan gratis di bawah untuk mengunggah foto SS kamu:
          </p>
          
          <!-- Pilihan Tombol Layanan -->
          <div class="grid grid-cols-3 gap-1.5 pt-1">
            <a href="https://imgbb.com/upload" target="_blank" rel="noopener noreferrer" 
               class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/30 rounded-lg py-2 text-[11px] font-medium text-center transition">
              ImgBB ↗
            </a>
            <a href="https://postimages.org/" target="_blank" rel="noopener noreferrer" 
               class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/30 rounded-lg py-2 text-[11px] font-medium text-center transition">
              Postimages ↗
            </a>
            <a href="https://imgur.com/upload" target="_blank" rel="noopener noreferrer" 
               class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/30 rounded-lg py-2 text-[11px] font-medium text-center transition">
              Imgur ↗
            </a>
          </div>
        </div>

        <!-- Step 2: Input URL Gambar Balasan -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Langkah 2: Tempel Link Gambar (*Paste*)</label>
          <input type="url" id="imageUrlInput" placeholder="Contoh: https://ibb.co/xxx atau https://i.ibb.co/xxx/image.png" 
                 class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-yellow-500 transition">
        </div>

        <!-- Input Harga Terendah -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Harga Terendah (Reserve Price in Pi)</label>
          <input type="number" step="0.01" id="reservePriceInput" placeholder="Misal: 10" 
                 class="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-yellow-500 transition">
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2 pt-2">
        <button onclick="closeCreateModal()" class="flex-1 bg-gray-900 hover:bg-gray-800 text-gray-400 text-xs py-2.5 rounded-xl transition">
          Batal
        </button>
        <button id="btnPublish" onclick="submitNewListing()" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-gray-950 text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-1">
          <span>Rilis Lelang</span>
          <span class="text-[10px] opacity-75">(0.2 Pi)</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    // ==========================================
    // 1. KONFIGURASI SUPABASE
    // PERHATIAN: Ganti dengan URL dan ANON KEY Supabase milik kamu!
    // ==========================================
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"; 
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeAuction = null;
    let piUser = null;

    // ==========================================
    // 2. HELPER: NORMALISASI LINK GAMBAR
    // ==========================================
    function normalizeImageUrl(url) {
      if (!url) return '';
      let cleanUrl = url.trim();

      // Normalisasi Imgur viewer link
      if (cleanUrl.includes('imgur.com') && !cleanUrl.includes('i.imgur.com')) {
        const parts = cleanUrl.split('/');
        const id = parts[parts.length - 1];
        return `https://i.imgur.com/${id}.jpg`;
      }

      return cleanUrl;
    }

    // ==========================================
    // 3. INISIALISASI & LOAD DATA
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      fetchActiveAuction();
    });

    async function fetchActiveAuction() {
      const container = document.getElementById('auctionContent');
      
      try {
        const { data, error } = await supabaseClient
          .from('auctions')
          .select('*')
          .eq('status', 'active')
          .order('created_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (error) throw error;

        if (data) {
          activeAuction = data;
          renderAuctionUI(data);
        } else {
          activeAuction = null;
          renderEmptyState();
        }
      } catch (err) {
        console.error("Gagal mengambil data lelang:", err);
        container.innerHTML = `<p class="text-red-400 text-xs text-center p-4">Koneksi ke Supabase gagal. Pastikan URL dan API Key Supabase sudah benar.</p>`;
      }
    }

    // ==========================================
    // 4. RENDER UI LELANG
    // ==========================================
    function renderAuctionUI(auction) {
      const container = document.getElementById('auctionContent');
      const formattedImageUrl = normalizeImageUrl(auction.image_url);

      container.innerHTML = `
        <div class="w-full space-y-4">
          <div class="relative w-full h-64 bg-gray-950 rounded-xl overflow-hidden border border-gray-800">
            <img src="${formattedImageUrl}" 
                 alt="NFT Asset SS" 
                 class="w-full h-full object-contain"
                 onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300/111827/9CA3AF?text=Gagal+Memuat+Gambar';">
            <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/10 text-[10px] text-gray-300">
              Penjual: <span class="text-yellow-400 font-semibold">${auction.seller || 'Anonim'}</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 bg-gray-950 p-3 rounded-xl border border-gray-800">
            <div>
              <p class="text-[10px] text-gray-400 uppercase tracking-wider">Tawaran Tertinggi</p>
              <p class="text-lg font-bold text-yellow-400">${auction.highest_bid} <span class="text-xs font-normal text-gray-300">Pi</span></p>
            </div>
            <div class="text-right">
              <p class="text-[10px] text-gray-400 uppercase tracking-wider">Batas Minimum</p>
              <p class="text-sm font-semibold text-gray-300">${auction.reserve_price} Pi</p>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex gap-2">
              <input type="number" step="0.01" id="bidInput" placeholder="Masukkan nominal (Pi)..." 
                     class="flex-1 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-500 transition">
              <button onclick="submitBid()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold px-4 py-2 rounded-xl text-xs transition">
                Tawar
              </button>
            </div>
            <p class="text-[10px] text-gray-500 text-center">Penawaran harus lebih tinggi dari penawaran tertinggi saat ini.</p>
          </div>
        </div>
      `;
    }

    function renderEmptyState() {
      const container = document.getElementById('auctionContent');
      container.innerHTML = `
        <div class="text-center py-8 space-y-3">
          <div class="w-12 h-12 bg-gray-950 border border-gray-800 rounded-full flex items-center justify-center mx-auto text-gray-600">
            🏷️
          </div>
          <p class="text-gray-400 text-xs">Belum ada lelang aktif saat ini.</p>
          <button onclick="openCreateModal()" class="text-xs bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold px-4 py-2 rounded-xl transition">
            Mulai Lelang Pertama
          </button>
        </div>
      `;
    }

    // ==========================================
    // 5. MODAL & PROSES RILIS LELANG
    // ==========================================
    function openCreateModal() {
      document.getElementById('createModal').classList.remove('hidden');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
      document.getElementById('imageUrlInput').value = '';
      document.getElementById('reservePriceInput').value = '';
    }

    async function submitNewListing() {
      const rawImageUrl = document.getElementById('imageUrlInput').value.trim();
      const reserveInput = parseFloat(document.getElementById('reservePriceInput').value);
      const btnPublish = document.getElementById('btnPublish');

      if (!rawImageUrl) {
        alert("Harap tempelkan link gambar balasan!");
        return;
      }

      if (isNaN(reserveInput) || reserveInput <= 0) {
        alert("Harap tentukan harga minimum lelang yang valid!");
        return;
      }

      // Memastikan URL Supabase disiapkan sebelum mengirim
      if (SUPABASE_URL.includes("YOUR_PROJECT_ID")) {
        alert("Gagal: URL/Key Supabase belum dikonfigurasi di dalam kode JavaScript!");
        return;
      }

      const imageUrl = normalizeImageUrl(rawImageUrl);
      btnPublish.disabled = true;
      btnPublish.innerText = "Merilis...";

      try {
        const endsAt = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
        const sellerName = piUser ? piUser.username : "Seller_Master";

        const { data, error } = await supabaseClient
          .from('auctions')
          .insert([{
            seller: sellerName,
            image_url: imageUrl,
            reserve_price: reserveInput,
            highest_bid: reserveInput,
            ends_at: endsAt,
            status: 'active'
          }])
          .select()
          .single();

        if (error) {
          alert("Gagal merilis lelang: " + error.message);
        } else {
          closeCreateModal();
          activeAuction = data;
          renderAuctionUI(data);
          alert("Lelang berhasil dirilis!");
        }
      } catch (err) {
        alert("Gagal terhubung ke server: " + err.message);
      } finally {
        btnPublish.disabled = false;
        btnPublish.innerHTML = `<span>Rilis Lelang</span> <span class="text-[10px] opacity-75">(0.2 Pi)</span>`;
      }
    }

    // ==========================================
    // 6. PROSES BIDDING
    // ==========================================
    async function submitBid() {
      if (!activeAuction) return;

      const bidInput = parseFloat(document.getElementById('bidInput').value);
      if (isNaN(bidInput) || bidInput <= activeAuction.highest_bid) {
        alert(`Penawaran harus lebih besar dari ${activeAuction.highest_bid} Pi!`);
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from('auctions')
          .update({ highest_bid: bidInput })
          .eq('id', activeAuction.id)
          .select()
          .single();

        if (error) {
          alert("Gagal mengajukan penawaran: " + error.message);
        } else {
          activeAuction = data;
          renderAuctionUI(data);
          alert("Penawaran kamu berhasil dimasukkan!");
        }
      } catch (err) {
        alert("Terjadi kesalahan saat menawar: " + err.message);
      }
    }
  </script>
</body>
</html>
